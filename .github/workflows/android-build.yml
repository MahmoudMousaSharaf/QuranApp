name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Patch Gradle config (fix No matching variant)
        run: |
          # Pin AGP version to 8.9.2 to avoid 8.11.0 bug
          sed -i "s|classpath('com.android.tools.build:gradle')|classpath('com.android.tools.build:gradle:8.9.2')|" android/build.gradle
          
          # Also pin in settings.gradle pluginManagement if exists
          sed -i "s|classpath('com.android.tools.build:gradle')|classpath('com.android.tools.build:gradle:8.9.2')|" android/settings.gradle 2>/dev/null || true
          
          # Add autolinking cache cleanup to settings.gradle
          cat > /tmp/autolinking_fix.txt << 'EOF'
          // Force-delete autolinking cache (fix path mismatch)
          def autolinkingCacheDir = new File(rootDir, "build/generated/autolinking")
          if (!System.getProperty("os.name").toLowerCase().contains("windows")) {
            autolinkingCacheDir.deleteDir()
          }
          EOF
          sed -i '1r /tmp/autolinking_fix.txt' android/settings.gradle
          
          # Clean any existing cache
          rm -rf android/build/generated/autolinking
          
          # Verify patches
          echo "=== build.gradle dependencies ==="
          grep -n "gradle" android/build.gradle | head -5
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          
          # Print all subproject build.gradle files to find AGP conflicts
          echo "=== Searching for AGP version declarations in node_modules ==="
          find node_modules -name "build.gradle" -exec grep -l "com.android.tools.build:gradle" {} \; 2>/dev/null | head -20
          echo "=== AGP versions found ==="
          grep -r "com.android.tools.build:gradle" node_modules/*/android/build.gradle 2>/dev/null | head -20

      - name: Configure SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK (Debug first to isolate issue)
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "=== Trying debug build first ==="
          ./gradlew assembleDebug --no-daemon -x lint --stacktrace 2>&1 | tee gradle-output.txt
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== DEBUG BUILD FAILED ==="
            echo "=== Last 80 lines of output ==="
            tail -80 gradle-output.txt
            exit 1
          fi
          echo "=== Debug build succeeded, now trying release ==="
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace 2>&1 | tee -a gradle-output.txt
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "=== RELEASE BUILD FAILED ==="
            tail -80 gradle-output.txt
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: android/gradle-output.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
