name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Patch Gradle config (fix No matching variant)
        run: |
          # Pin AGP version to avoid 8.11.0 bug
          sed -i "s/classpath('com.android.tools.build:gradle')/classpath('com.android.tools.build:gradle:8.9.2')/" android/build.gradle
          
          # Add autolinking cache cleanup to settings.gradle
          sed -i '1i\
          // Force-delete autolinking cache (fix Windows/Linux path mismatch)\
          def autolinkingCacheDir = new File(rootDir, "build/generated/autolinking")\
          if (!System.getProperty("os.name").toLowerCase().contains("windows")) {\
            autolinkingCacheDir.deleteDir()\
          }\
          ' android/settings.gradle
          
          # Clean any existing cache
          rm -rf android/build/generated/autolinking

      - name: Configure SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace 2>&1 | tee gradle-output.txt
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "=== BUILD FAILED ==="
            grep -i "error\|FAILURE\|No matching variant\|exception" gradle-output.txt | tail -30
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: android/gradle-output.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
