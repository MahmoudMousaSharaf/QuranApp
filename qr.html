<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subh — Scan QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: white;
            padding: 20px;
        }
        h1 { font-size: 28px; margin: 0 0 8px; }
        p { font-size: 16px; opacity: 0.9; margin: 4px 0; text-align: center; }
        .qr-container {
            background: white;
            padding: 24px;
            border-radius: 20px;
            margin: 24px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .qr-container canvas, .qr-container img { display: block; width: 300px !important; height: 300px !important; }
        .steps {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px 28px;
            margin-top: 16px;
            max-width: 500px;
        }
        .steps ol { padding-left: 20px; line-height: 2; font-size: 15px; }
        .url {
            background: rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            margin-top: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>Subh App</h1>
    <p>Scan this QR code with Expo Go</p>
    <div class="qr-container" id="qrcode"></div>
    <div class="steps">
        <ol>
            <li>Install <b>Expo Go</b> from App Store (iPhone) or Google Play (Android)</li>
            <li>Make sure your phone is on the <b>same WiFi</b> as this computer</li>
            <li>Open Expo Go and <b>scan this QR code</b></li>
        </ol>
        <div class="url">exp://192.168.1.9:7070</div>
    </div>
    <script>
        new QRCode(document.getElementById('qrcode'), {
            text: 'exp://192.168.1.9:7070',
            width: 300,
            height: 300,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
